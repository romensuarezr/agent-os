# ==============================================================================
# Bane — Docker Compose Template (Agent OS)
# Tool: Sovereign deep research & reasoning search engine (Perplexity alternative)
# Image: ghcr.io/pythops/bane:latest
# Persistence: Named volume bane-data mounted at /data
# ==============================================================================

services:
  bane:
    image: ghcr.io/pythops/bane:latest
    container_name: bane
    restart: unless-stopped
    ports:
      - "${HOST_BIND_IP:-127.0.0.1}:${BANE_PORT:-3000}:3000"
    environment:
      - PORT=3000
      - INFERENCE_URL=${BANE_INFERENCE_URL:-http://<nodo-inferencia>:3001/v1}
      - API_KEY=${BANE_API_KEY:-}
      - SEARCH_URL=${BANE_SEARCH_URL:-http://<nodo-inferencia>:8080}
    volumes:
      - bane-data:/data
    deploy:
      resources:
        limits:
          cpus: "${BANE_CPU_LIMIT:-1.0}"
          memory: "${BANE_MEMORY_LIMIT:-250M}"
        reservations:
          cpus: "${BANE_CPU_RESERVATION:-0.1}"
          memory: "${BANE_MEMORY_RESERVATION:-64M}"
    networks:
      - default

networks:
  default:

volumes:
  bane-data:
    driver: local
