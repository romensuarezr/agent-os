# Homepage - Docker Compose Template (Agent OS)
# Tool: Highly customizable self-hosted service dashboard & fleet monitor
# Image: ghcr.io/gethomepage/homepage:latest
# Configuration: Declarative YAML files mounted in /app/config
# Persistence: Named volume homepage-config mounted at /app/config
# Security: ADR 004 compliant - Docker socket isolation via RO proxy with 32MB limit

services:
  docker-socket-proxy:
    image: tecnativa/docker-socket-proxy:latest
    container_name: homepage-docker-socket-proxy
    restart: unless-stopped
    mem_limit: 32m
    deploy:
      resources:
        limits:
          memory: 32M
    environment:
      - CONTAINERS=1
      - INFO=1
      - POST=0
      - BUILD=0
      - COMMIT=0
      - CONFIGS=0
      - DISTRIBUTION=0
      - EXEC=0
      - IMAGES=0
      - NETWORKS=0
      - NODES=0
      - PLUGINS=0
      - SECRETS=0
      - SERVICES=0
      - SESSION=0
      - SWARM=0
      - SYSTEM=0
      - TASKS=0
      - VOLUMES=0
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - homepage-internal

  homepage:
    image: ghcr.io/gethomepage/homepage:latest
    container_name: homepage
    ports:
      - "3000:3000"
    volumes:
      - homepage-config:/app/config
    environment:
      - PUID=1000
      - PGID=1000
    depends_on:
      - docker-socket-proxy
    networks:
      - default
      - homepage-internal
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "node -e 'fetch(\"http://localhost:3000\").then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))'"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

networks:
  homepage-internal:
    internal: true

volumes:
  homepage-config:
    name: homepage-config
