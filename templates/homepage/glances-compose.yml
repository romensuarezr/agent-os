# Glances Web Server - Docker Compose Template (Agent OS)
# Host target: <worker-node> (via VPN/Tailscale)
# Image: nicolargo/glances:latest-full
# Purpose: Remote host telemetry provider for Homepage dashboard
# Compliance: ADR 004 (Exclusively executed on <worker-node>; 0 footprint on <infra-node>)

services:
  glances:
    image: nicolargo/glances:latest-full
    container_name: glances-telemetry
    restart: unless-stopped
    ports:
      # Bound strictly to private/VPN IP to prevent public WAN exposure
      - "${GLANCES_BIND_IP:-127.0.0.1}:61208:61208"
    environment:
      - GLANCES_OPT=-w
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /etc/os-release:/etc/os-release:ro
    pid: host
