version: '3.8'

services:
  docker-socket-proxy:
    image: tecnativa/docker-socket-proxy:latest
    container_name: homepage-docker-socket-proxy
    restart: unless-stopped
    mem_limit: 32m
    deploy:
      resources:
        limits:
          memory: 32M
    environment:
      - CONTAINERS=1
      - INFO=1
      - POST=0
      - BUILD=0
      - COMMIT=0
      - CONFIGS=0
      - DISTRIBUTION=0
      - EXEC=0
      - IMAGES=0
      - NETWORKS=0
      - NODES=0
      - PLUGINS=0
      - SECRETS=0
      - SERVICES=0
      - SESSION=0
      - SWARM=0
      - SYSTEM=0
      - TASKS=0
      - VOLUMES=0
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - homepage-internal

  homepage:
    image: ghcr.io/gethomepage/homepage:latest
    container_name: homepage
    restart: unless-stopped
    depends_on:
      - docker-socket-proxy
    environment:
      - PUID=1000
      - PGID=1000
    volumes:
      - g8o4sgwsw8k4c0cscoskkks8_config:/app/config
    networks:
      - coolify
      - homepage-internal

networks:
  coolify:
    external: true
  homepage-internal:
    internal: true

volumes:
  g8o4sgwsw8k4c0cscoskkks8_config:
    external: true
