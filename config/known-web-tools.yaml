# ==============================================================================
# Agent OS — Known Web AI & Developer Tools Signatures Catalog
# ==============================================================================
# This declarative registry defines web AI platforms, developer tools, and cloud
# consoles detected during browser bookmarks/PWA scanning (discover-fleet.sh).
#
# INSTRUCTIONS:
# - Add new domains below to expand detection capabilities.
# - You can also create `config/known-web-tools.local.yaml` for private tools.
# ==============================================================================

version: "1.0"

domains:
  # --- Modelos y Chat Conversacional / Razonamiento ---
  claude.ai:
    name: "claude_pro"
    provider: "Anthropic"
    category: "reasoning_and_chat"
    description: "Complex architectural reasoning and refactoring"

  chatgpt.com:
    name: "chatgpt_plus"
    provider: "OpenAI"
    category: "general_llm_and_code"
    description: "Conversational code generation and canvas"

  chat.openai.com:
    name: "chatgpt_plus"
    provider: "OpenAI"
    category: "general_llm_and_code"
    description: "Conversational code generation and canvas (legacy endpoint)"

  aistudio.google.com:
    name: "google_ai_studio"
    provider: "Google"
    category: "massive_context"
    description: "Massive context analysis (up to 2M tokens free tier)"

  gemini.google.com:
    name: "gemini_advanced"
    provider: "Google"
    category: "general_llm"
    description: "Multimodal and general assistant"

  perplexity.ai:
