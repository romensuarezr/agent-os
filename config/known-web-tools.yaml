    category: "reasoning"
    description: "Deep reasoning models (R1/V3)"

  poe.com:
    name: "poe"
    provider: "Quora"
    category: "multi_model_aggregator"
    description: "Multi-bot AI aggregator"

  openrouter.ai:
    name: "openrouter"
    provider: "OpenRouter"
    category: "api_gateway"
    description: "Unified AI models API and playground"

  groq.com:
    name: "groq"
    provider: "Groq"
    category: "ultra_fast_inference"
    description: "Ultra-low latency LPU cloud inference"

  # --- Pasarelas de Inferencia y Routers (AI Gateways) ---
  omniroute.io:
    name: "omniroute"
    provider: "OmniRoute (Diego Souza)"
    category: "ai_gateway_and_router"
    description: "Unified AI gateway with 350+ providers, auto-fallback and context compression"

  omnirouter.ai:
    name: "omnirouter"
    provider: "OmniRouter"
    category: "ai_gateway_and_router"
    description: "AI routing and multi-provider proxy platform"

  portkey.ai:
    name: "portkey"
    provider: "Portkey AI"
    category: "ai_gateway_and_router"
    description: "Production AI gateway with guardrails, fallbacks and routing"

  litellm.ai:
    name: "litellm"
    provider: "BerriAI"
    category: "ai_gateway_and_router"
    description: "OpenAI-compatible proxy and model load balancer"

  # --- Generación de UI y Fullstack ---
  v0.dev:
    name: "v0"
    provider: "Vercel"
    category: "ui_component_generation"
    description: "Generative UI for React and Tailwind CSS"

  bolt.new:
    name: "bolt_new"
    provider: "StackBlitz"
    category: "fullstack_in_browser"
    description: "In-browser autonomous fullstack app development"

  lovable.dev:
    name: "lovable"
    provider: "Lovable"
    category: "fullstack_agent_builder"
    description: "Web application creation platform"

  replit.com:
    name: "replit"
    provider: "Replit"
    category: "cloud_dev_environment"
    description: "Cloud-hosted development workspace and agent deployment"

  # --- Ecosistema y Model Hubs ---
  huggingface.co:
    name: "huggingface"
