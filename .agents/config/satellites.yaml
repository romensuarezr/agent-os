# ==============================================================================
# Agent OS — Declaración de repositorios satélite (T-104)
# ==============================================================================
# Este fichero declara los repositorios a los que `dispatch-satellite.sh` puede
# despachar tareas. Se distribuye a los hijos vía `assets-manifest.txt`.
#
# CONVENCIÓN DE RUTAS (obligatoria, porque se distribuye):
#   - Solo rutas `~`-relativas (`~/Proyectos/mi-repo`) o relativas al propio
#     satélite (para `worktree_base`). NUNCA rutas absolutas con el home del
#     operador (`/home/<usuario>/...`): en la máquina de otro operador esa ruta
#     no existe, y además es un literal de infraestructura que el check 22
#     rechaza. El dispatcher solo expande el prefijo literal `~/` contra $HOME.
#   - Este fichero NO contiene satélites reales: las entradas del operador son
#     estado local (como `fleet.yaml`), así que aquí solo vive el esquema con
#     ejemplos comentados. Descomenta y adapta para activar.
#
# ESQUEMA:
#   version: "1.0"          versión del esquema
#   satellites:             mapa alias → declaración
#     <alias>:
#       path: <ruta>          OBLIGATORIO. Repo git destino (`~`-relativa).
#       worktree_base: <ruta> OPCIONAL. Dónde aterriza el worktree.
#                             Default: `.worktrees/` dentro del satélite
#                             (refleja el comportamiento de worktree-dispatch.sh).
#                             Acepta ruta `~`-relativa para sacarlo del repo.
#       route: <modo>         OPCIONAL. `auto` (default), `orca` o `git`.
#                             `auto` = Orca si hay runtime, Git-nativo si no.
#                             `orca`/`git` fuerzan la ruta; `orca` sin runtime
#                             es un error, `git` nunca toca el runtime.
# ==============================================================================

version: "1.0"

satellites:
  # Ejemplo (descomenta y adapta):
  # mi-satelite:
  #   path: ~/Proyectos/mi-satelite
  #   worktree_base: .worktrees/
  #   route: auto
