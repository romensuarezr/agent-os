version: "1.0.0"
description: "Catálogo declarativo de estrategias de orquestación y reglas de umbral de Agent OS."

thresholds:
  direct_max_files: 3
  direct_rationale: "Tareas con <= 3 archivos incurren en mayor gasto de tokens por floor cost de delegación y transcripts que ejecutadas directamente en mono-agente."

heartbeat:
  enabled: true
  interval_minutes: 3
  verbose_threshold_minutes: 5
  description: "Telemetría de latidos proactivos periódicos durante ejecuciones paralelas o prolongadas para mitigar el silencio de radio y la ansiedad de la caja negra."

default_playbook: "direct"

playbooks:
  direct:
    name: "Ejecución Directa (Mono-Agente Local)"
    description: "Ejecución secuencial en la sesión actual sin crear worktrees ni subagentes."
    trigger: "Caja de archivos <= 3, fixes atómicos o tests localizados."
    strategy: "direct_execution"
    isolation_level: "none"
    roles:
      executor: "coordinator"

  scout-then-build:
    name: "Prospección Previa + Implementación"
    description: "Fase de exploración de solo lectura a coste $0 (scout.sh / searxng-client.sh) antes de formular el plan."
    trigger: "Incertidumbre arquitectónica, nuevas dependencias externas o búsqueda de referencias OSS."
    strategy: "scout_and_build"
    isolation_level: "read_only"
    roles:
      researcher: "docs-researcher"
      executor: "coordinator"

  plan-big-execute-small:
    name: "Planifica en Grande, Ejecuta en Pequeño"
    description: "Coordinador formula el plan y contratos en modelo de alta capacidad; workers económicos o locales ejecutan el código mecánico."
    trigger: "Tareas extensas con diseño arquitectónico exigente pero código mecánico intensivo."
    strategy: "tiered_delegation"
    isolation_level: "worktree"
    roles:
      planner: "coordinator"
      worker: "coder"
      reviewer: "qa-judge"

  parallel-worktrees:
    name: "Despacho Paralelo en Git Worktrees"
    description: "Despacho concurrente de tareas independientes en árboles de trabajo aislados con integración controlada."
    trigger: "Múltiples tareas del sprint en carriles DAG independientes con cajas de archivos disjuntas."
    strategy: "parallel_worktrees"
    isolation_level: "worktree"
    roles:
      dispatcher: "coordinator"
      workers: ["coder"]
      integrator: "coordinator"

  review-gate:
    name: "Compuerta de Revisión y Arbitraje Desacoplado"
    description: "Auditoría obligatoria de planes y diffs mediante qa-judge determinista y verify-goal.sh antes de la integración."
    trigger: "Tareas críticas que modifiquen contratos globales, seguridad o interfaces del core."
    strategy: "review_gate"
    isolation_level: "sandbox"
    roles:
      evaluator: "qa-judge"

effort_strategy:
  mode: "dynamic_quota_aware"
  description: "Selección dinámica de modelos y nivel de esfuerzo basada en dificultad de la tarea y cuota disponible."
  discovery_mechanism: "runtime_probing"
  tiers:
    low:
      target: "mechanical_boilerplate_tests"
      effort_level: "low"
      quota_preference: "highest_available_daily_reset"
      rationale: "Código repetitivo y lectura de archivos no requiere razonamiento profundo; maximiza ahorro de cuota premium."
    medium:
      target: "routes_actions_apis"
      effort_level: "medium"
      quota_preference: "balanced"
      rationale: "Lógica de negocio estándar y manejo de estado con esfuerzo moderado."
    high:
      target: "architecture_security_refactors"
      effort_level: "high_or_thinking"
      quota_preference: "deep_reasoning"
      rationale: "Decisiones de diseño complejas e invariantes de seguridad requieren máxima capacidad cognitiva."
  accountability:
    required: true
    report_fields: ["task_id", "harness", "model", "effort", "rationale", "quota_balance"]
