# ==============================================================================
# Agent OS — Declarative Fleet Configuration Template
# ==============================================================================
# This template defines the structure for configuring local tools, remote nodes,
# Web/Cloud AI endpoints, and Model Context Protocol (MCP) servers.
#
# INSTRUCTIONS:
# 1. Copy this file to `config/fleet.yaml`:
#    cp config/fleet.example.yaml config/fleet.yaml
# 2. Customize `config/fleet.yaml` with your actual local and remote environments.
# 3. `config/fleet.yaml` is excluded by .gitignore to protect private IPs and keys.
# ==============================================================================

version: "1.0"
environment_name: "default-workstation"

# ------------------------------------------------------------------------------
# 1. Local Environment Tools
# ------------------------------------------------------------------------------
local_environment:
  os: "linux"
  package_managers:
    - "apt"
    - "npm"
    - "pip"
  installed_clis:
    git:
      status: "available"
      description: "Distributed version control system"
    gh:
      status: "available"
      description: "GitHub CLI for PRs, issues and repos"
    docker:
      status: "available"
      description: "Container virtualization runtime"
    curl:
      status: "available"
      description: "Command line data transfer tool"
    jq:
      status: "available"
      description: "Lightweight command-line JSON processor"
    opencode:
      status: "available"
      version: "2.2.7"
      description: "Terminal autonomous AI coding worker (acotado en sandbox/worktree)"
    agy:
      status: "available"
      description: "Google Antigravity CLI — principal orchestrator & tier-1 reviewer"
    tailscale:
      status: "available"
      description: "Mesh VPN for secure node interconnectivity"
    infisical:
      status: "optional"
      description: "End-to-end encrypted secret manager CLI"

# ------------------------------------------------------------------------------
# 2. Remote Compute Nodes (VPS, Servers, Local Network Machines)
# ------------------------------------------------------------------------------
# HOST CONVENTION / TOPOLOGÍA CANÓNICA ESPERADA POR EL CONTROL PLANE:
#   - local: Estación de trabajo local (desarrollo, IDEs, git, runners).
#   - <nodo-inferencia>: Nodo dedicado a inferencia IA ($0) y datos (FreeLLMAPI, Ollama, Glances, SearXNG).
#   - <nodo-orquestacion>: Nodo dedicado a orquestación y PaaS (Coolify, Infisical, Bytebox, Homepage).
# ------------------------------------------------------------------------------
nodes:
  <nodo-inferencia>:
    role: "inference-and-data"
    connection: "tailscale"
    host: "192.0.2.10" # RFC 5737 Documentation Prefix (sustituir por IP privada real en fleet.yaml)
    services:
      freellmapi:
        endpoint: "http://192.0.2.10:3001/v1"
        auth: "bearer_token"
        description: "Unified AI inference proxy aggregator"
        cost_per_token: 0.00
      ollama:
        endpoint: "http://192.0.2.10:11434"
        models:
          - "qwen2.5:7b"
          - "llama3.1:8b"
          - "deepseek-r1:8b"
      glances:
        endpoint: "http://192.0.2.10:61208"
        version: "4.5.9"
        label: "DataManager"
        description: "Hardware telemetry daemon (ADR 004 compliant)"
      searxng:
        endpoint: "http://192.0.2.10:8080"
        description: "Self-hosted meta-search engine"

  <nodo-orquestacion>:
    role: "orchestration-and-paas"
    connection: "ssh"
    host: "203.0.113.10" # RFC 5737 Documentation Prefix (sustituir por IP real en fleet.yaml)
    services:
      coolify:
        url: "https://coolify.example.com"
        description: "Self-hosted PaaS dashboard for app deployments"
      traefik:
        description: "Edge reverse proxy with automatic SSL"
      orca_gateway:
        endpoint: "http://localhost:8000"
        description: "Task queue and read-only inspection engine"
      infisical:
        endpoint: "http://infisical.example.com"
        admin_console: "http://infisical.example.com/admin"
        api_url: "http://infisical.example.com/api"
        auth_type: "universal-auth"
        project_id: "example-project-uuid"
        project_slug: "agent-os-example"
        description: "Infisical Community Edition standalone lite secrets manager"
      bytebox:
        url: "https://bytebox.example.com"
        coolify_uuid: "example-application-uuid"
        storage_engine: "sqlite"
        description: "Developer CLI commands, code snippets and notes organizer"
      homepage:
        url: "https://homepage.example.com"
        coolify_uuid: "example-application-uuid-homepage"
        description: "Fleet control dashboard and service status monitor"
      nango:
        endpoint: "http://203.0.113.10:3003"
        url: "http://<nodo-orquestacion>:3003"
        connect_ui_url: "http://<nodo-orquestacion>:3009"
        description: "Self-hosted unified OAuth & API integration platform"

# ------------------------------------------------------------------------------
# 2b. Fleet Observability & Dashboard Monitoring (Homepage)
# ------------------------------------------------------------------------------
monitoring:
  search:
    enabled: true
    provider: "duckduckgo"
    target: "_blank"
  github:
    enabled: true
    repo: "romensuarezr/agent-os"
    description: "Core Architecture, Workflows, Skills & Multi-Agent Engine"
  docker_socket_proxy:
    enabled: true
    host: "tcp://docker-socket-proxy:2375"

# ------------------------------------------------------------------------------
# 3. Model Context Protocol (MCP) Standard Server Definitions
# ------------------------------------------------------------------------------
# Aligned with the standard MCP client specification.
# Supports both local stdio servers (command, args, env) and remote HTTP/SSE servers (url, transport, headers).
mcpServers:
  coolify:
    command: "npx"
    args:
      - "-y"
      - "@masonator/coolify-mcp"
    env:
      COOLIFY_BASE_URL: "https://coolify.example.com"
      COOLIFY_ACCESS_TOKEN: "${COOLIFY_ACCESS_TOKEN}"
    description: "Coolify PaaS infrastructure management and app deployment"

  filesystem:
    command: "npx"
    args:
      - "-y"
      - "@modelcontextprotocol/server-filesystem"
      - "/path/to/allowed/directory"
    description: "Secure local filesystem access for agents"

  github:
    command: "npx"
    args:
      - "-y"
      - "@modelcontextprotocol/server-github"
    env:
      GITHUB_PERSONAL_ACCESS_TOKEN: "${GITHUB_TOKEN}"
    description: "GitHub repository and pull request automation"

  fetch:
    command: "uvx"
    args:
      - "mcp-server-fetch"
    description: "Optimized web page content fetching for LLM consumption"

  memory:
    command: "npx"
    args:
      - "-y"
      - "@modelcontextprotocol/server-memory"
    description: "Persistent knowledge graph memory across agent sessions"

  # Remote HTTP/SSE MCP Servers
  deepwiki:
    url: "https://mcp.deepwiki.com/mcp"
    transport: "http"
    description: "Deep structural repository analysis and documentation ingestion"

  remote_example:
    url: "https://mcp.example.com/sse"
    transport: "sse"
    headers:
      Authorization: "Bearer ${REMOTE_MCP_TOKEN}"
    description: "Authenticated remote SSE MCP server example"

# ------------------------------------------------------------------------------
# 4. Web & Cloud AI Interfaces (Manual or API Access)
# ------------------------------------------------------------------------------
cloud_and_web_ai:
  claude_pro:
    provider: "Anthropic"
    tier: "subscription"
    strengths: ["Complex architectural reasoning", "Refactoring", "Documentation"]
  chatgpt_plus:
    provider: "OpenAI"
    tier: "subscription"
    strengths: ["Code generation", "Browsing", "Canvas"]
  perplexity:
    provider: "Perplexity AI"
    tier: "subscription"
    strengths: ["Real-time technical research", "Per-library documentation search"]
  gemini_advanced:
    provider: "Google"
    tier: "subscription"
    strengths: ["Large context windows (1M+ tokens)", "Multimodal analysis"]

# ------------------------------------------------------------------------------
# 5. Routing Policies & Inference Hierarchy
# ------------------------------------------------------------------------------
routing:
  local_zero_cost_first: true
  primary_agent_runtime: "antigravity"
  fallback_agent_runtime: "opencode"
  default_local_llm_endpoint: "http://192.0.2.10:3001/v1"
  default_local_model: "qwen2.5:7b"
